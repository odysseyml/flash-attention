name: Build fused_dense_lib matrix

# Builds `fused_dense_lib` (csrc/fused_dense_lib only — no layer_norm, which the
# kernels-community/layer-norm repo already covers) across the same torch/CUDA
# matrix as kernels-community builds, for repackaging into the HF Hub repo
# odyssey-systems/fused-dense-lib in kernels build-variant layout.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload wheels to"
        required: true
        default: "fused-dense-matrix-1"

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions:
  contents: write

jobs:
  setup_release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_REF_NAME" \
            --title "${{ inputs.release_tag }}" \
            --notes "fused_dense_lib wheels across the kernels-community torch/CUDA matrix."

  build:
    name: cu${{ matrix.combo.cuda_short }} torch${{ matrix.combo.torch }} ${{ matrix.os }}
    needs: setup_release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        combo:
          - { torch: "2.10.*", cuda: "13.0.2", cuda_short: "130" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android || true

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.combo.cuda }}
          method: "network"

      - name: Install torch
        run: |
          pip install --upgrade pip
          pip install setuptools==75.8.0 wheel ninja packaging "typing-extensions>=4.12"
          pip install --no-cache-dir "torch==${{ matrix.combo.torch }}" \
            --index-url "https://download.pytorch.org/whl/cu${{ matrix.combo.cuda_short }}"
          python -c "import torch; print(torch.__version__, torch.version.cuda)"

      - name: Build fused_dense_lib wheel
        env:
          MAX_JOBS: 2
          NVCC_THREADS: 2
        run: |
          pushd csrc/fused_dense_lib
          timeout 1h python setup.py bdist_wheel --dist-dir "$GITHUB_WORKSPACE/dist"
          popd
          TORCH_MM=$(python -c "import torch; print('.'.join(torch.__version__.split('.')[:2]))")
          for f in dist/fused_dense_lib-*.whl; do
            mv "$f" "${f/.whl/+cu${{ matrix.combo.cuda_short }}torch${TORCH_MM}.whl}" || true
          done
          ls dist/

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
