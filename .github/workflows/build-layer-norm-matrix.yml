name: Build layer_norm (+ optional flash-attn) for cu130

# Builds csrc/layer_norm (grafted layer-norm variant for odyssey-systems/layer-norm)
# and, where upstream lacks wheels, the full flash-attn wheel, for a chosen
# torch/CUDA. sm80/90/100/120. torch/CUDA are workflow_dispatch inputs so the same
# workflow builds torch2.10 cu130 (default) or torch2.9 cu130 (upstream ships
# torch2.9 flash-attn wheels, so set build_flash_attn=false there — only layer_norm
# is missing for cu130).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload wheels to"
        required: true
        default: "torch210-cu130-1"
      torch_version:
        description: "torch version spec (e.g. 2.10.* or 2.9.*)"
        required: true
        default: "2.10.*"
      cuda_version:
        description: "CUDA toolkit version (e.g. 13.0.2)"
        required: true
        default: "13.0.2"
      cuda_short:
        description: "CUDA short tag for the wheel index + filename (e.g. 130)"
        required: true
        default: "130"
      build_flash_attn:
        description: "Also build the flash-attn wheel (set false for torch2.9 — upstream ships it)"
        required: true
        default: "true"

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions:
  contents: write

jobs:
  setup_release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_REF_NAME" --title "${{ inputs.release_tag }}" \
            --notes "layer_norm (+ flash-attn where built) wheels for torch ${{ inputs.torch_version }} / cu${{ inputs.cuda_short }}."

  build:
    name: ${{ matrix.target }} ${{ matrix.os }}
    needs: setup_release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        target: [layer_norm, flash_attn]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android || true

      - name: Set up swap
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ inputs.cuda_version }}
          method: "network"

      - name: Install torch
        run: |
          pip install --upgrade pip
          pip install setuptools==75.8.0 wheel ninja packaging psutil "typing-extensions>=4.12"
          pip install --no-cache-dir "torch==${{ inputs.torch_version }}" --index-url "https://download.pytorch.org/whl/cu${{ inputs.cuda_short }}"
          python -c "import torch; print(torch.__version__, torch.version.cuda)"

      - name: Build layer_norm
        if: matrix.target == 'layer_norm'
        env:
          MAX_JOBS: 2
          NVCC_THREADS: 2
        run: |
          pushd csrc/layer_norm
          timeout 5h python setup.py bdist_wheel --dist-dir "$GITHUB_WORKSPACE/dist"
          popd

      - name: Build flash-attn
        if: matrix.target == 'flash_attn' && inputs.build_flash_attn == 'true'
        env:
          MAX_JOBS: 2
          NVCC_THREADS: 2
          FLASH_ATTENTION_FORCE_BUILD: "TRUE"
          FLASH_ATTN_CUDA_ARCHS: "80;90;100;120"
        run: |
          timeout 5.5h python setup.py bdist_wheel --dist-dir "$GITHUB_WORKSPACE/dist"

      - name: Rename and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No wheels for this target/combo (e.g. flash-attn skipped); nothing to upload."
            exit 0
          fi
          TORCH_MM=$(python -c "import torch; print('.'.join(torch.__version__.split('.')[:2]))")
          for f in "${wheels[@]}"; do
            base=$(basename "$f" .whl)
            mv "$f" "dist/${base}+cu${{ inputs.cuda_short }}torch${TORCH_MM}.whl"
          done
          ls dist/
          gh release upload "${{ inputs.release_tag }}" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
